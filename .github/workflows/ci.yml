name: SignalRoom CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    env:
      SIGNALROOM_MODEL_MODE: replay
      SIGNALROOM_SKIP_SEED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
        working-directory: apps/api
      - run: pytest -q
        working-directory: apps/api
      # Replays the recorded model responses under apps/api/recordings, so this
      # needs no key and reproduces the numbers in docs/evaluation.md.
      - run: python evals/run.py --mode replay --no-docs
        working-directory: apps/api

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
