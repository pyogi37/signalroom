services:
  api:
    build: ./apps/api
    ports: ["8000:8000"]
    volumes: ["signalroom-data:/app/data"]
    environment:
      SIGNALROOM_DATA_DIR: /app/data
      SIGNALROOM_MODEL_MODE: ${SIGNALROOM_MODEL_MODE:-auto}
      SIGNALROOM_MODEL_BASE_URL: ${SIGNALROOM_MODEL_BASE_URL:-https://api.groq.com/openai/v1}
      SIGNALROOM_MODEL: ${SIGNALROOM_MODEL:-openai/gpt-oss-120b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
  web:
    build: ./apps/web
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  signalroom-data:
