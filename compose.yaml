services:
  api:
    build: ./apps/api
    ports: ["8000:8000"]
    volumes: ["signalroom-data:/app/data"]
    environment:
      SIGNALROOM_DATA_DIR: /app/data
      SIGNALROOM_LLM_PROVIDER: ${SIGNALROOM_LLM_PROVIDER:-local}
      SIGNALROOM_OPENAI_MODEL: ${SIGNALROOM_OPENAI_MODEL:-gpt-5-mini}
      SIGNALROOM_TRANSCRIBE_MODEL: ${SIGNALROOM_TRANSCRIBE_MODEL:-gpt-transcribe}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  web:
    build:
      context: ./apps/web
      args:
        VITE_SIGNALROOM_API_URL: ${VITE_SIGNALROOM_API_URL:-http://127.0.0.1:8000}
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  signalroom-data:
