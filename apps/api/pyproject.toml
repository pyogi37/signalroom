[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signalroom-api"
version = "0.1.0"
description = "Agent workflow API for SignalRoom"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "langgraph>=0.2",
  "langgraph-checkpoint-sqlite>=3.0",
  "mcp>=1.12,<2",
  "openai>=2.0",
  "pydantic>=2.9",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.12",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "pytest>=8.3"]

[tool.hatch.build.targets.wheel]
packages = ["src/signalroom"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
